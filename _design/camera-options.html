<script>
const camI = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>';

  `<b class="${i === 1 ? "on" : ""}">${d ? `<div>${n}<small>${t}</small></div>` : n}<span>${i === 1 ? tick : chili.repeat(c)}</span></b>`).join("") + `</div>`;
const at = (h, s) => h.replace("STYLE", s);
const chrome = (panel) => `<div class="dots"></div>${panel ? '<div class="panel cam"></div><div class="band cam"></div><div class="rdots"></div>' : ""}

const side = `<div class="eb w" style="left:1270px;top:230px">Roast heat</div>

  c: { title: "C · Full-screen mirror", panel: false, note: "The camera fills the whole screen like a photo-booth mirror. A face guide and a tip sit over the picture, the heat choices float on a dark card at the right, and the shutter sits bottom-centre.",
    html: `<div class="feed" style="left:0;top:167px;width:1920px;height:854px">${me}

      </div>` },
};

if (v) document.body.classList.add("one");

  `<section class="opt"><h2>${o.title}</h2><p>${o.note}</p><div class="fit"><div class="s">${chrome(o.panel)}${o.html}</div></div></section>`).join("");
