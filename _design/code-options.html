<div class="board" id="board"></div>
<script>
const KEYS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789".split("");
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
const delIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
const chrome = `<div class="dots"></div><div class="panel"></div><div class="band"></div>
  <header class="hd"><div class="brand"><img src="../assets/wendys-horiz-white.svg" alt="Wendy's"><i></i><span class="wf"><span class="w1">Wendy</span><span class="w2">Fest</span></span></div><div class="stp"><i>2</i><span>Your code</span></div></header>
  <div class="strp"></div>
  <footer class="ft"><span class="c"><img src="../assets/cameo.png" alt="">© 2026 Wendy’s Sri Lanka</span><span>Station A · Roast Me</span><span class="lk"><a>Terms</a><a>Privacy</a></span></footer>`;
const slots = (code, cls = "") => `<div class="slots ${cls}" style="STYLE">` + [0,1,2,3,4,5].map(i => code[i] ? `<b>${code[i]}</b>` : `<b class="e${i === code.length ? " a" : ""}"></b>`).join("") + `</div>`;
const kb = (split, cls = "") => `<div class="kb ${cls}" style="STYLE">` + KEYS.map(k => `<button class="${split && /\d/.test(k) ? "n" : ""}">${k}</button>`).join("") + `</div>`;
const at = (html, style) => html.replace("STYLE", style);
function qr() { let s = 7, r = ""; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; const fin = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) { const f = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16); if (!f && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 25 25" fill="#1E1B1B" shape-rendering="crispEdges">${r}${fin(0,0)}${fin(18,0)}${fin(0,18)}</svg>`; }
const left = (code, msg) => `
  <div class="eb" style="left:125px;top:230px">Guest code</div>
  <div class="t3" style="left:112px;top:280px"><span class="l1">Your</span><span class="l2">code.</span></div>
  <div class="sub" style="left:125px;top:540px;width:640px">6 letters and numbers, from your SMS or your Wendy Fest pass.</div>
  ${at(slots(code), "left:125px;top:664px")}
  <div class="msg" style="left:125px;top:816px">${msg}</div>
  <div class="ghostb" style="left:125px;top:888px">← Back</div>`;
const bars = n => `<i>${[0,1,2,3,4,5].map(i => `<u class="${i < n ? "on" : ""}"></u>`).join("")}</i>`;
const OPTS = {
  a: { title: "A · Tidy", note: "Closest to today. Six slots replace the wide box (it no longer runs into the white stripe). Keypad lines up with its label and the header edge, keys are taller, numbers sit in their own row, and Delete + Go fill the bottom row on the same baseline as Back.",
    html: left("", "") + `
      <div class="eb w" style="left:1080px;top:230px">Tap your code</div>
      ${at(kb(false), "left:1080px;top:290px;row-gap:12px")}
      <div class="act" style="left:1080px;top:830px"><button class="del">${delIcon}Delete</button><button class="go">Go${arrow}</button></div>` },
  b: { title: "B · Guided", note: "Same layout as A, plus feedback while typing: the active slot is ringed, a 6-step progress line counts down, number keys are tinted darker than letters, and Go stays an outline until all six characters are in.",
    html: left("K7M", bars(3) + "3 more to go") + `
      <div class="eb w" style="left:1080px;top:230px">Tap your code</div>
      ${at(kb(true), "left:1080px;top:290px")}
      <div class="act" style="left:1080px;top:830px"><button class="del">${delIcon}Delete</button><button class="go wait">3 more to go</button></div>` },
  c: { title: "C · Code above the keys", note: "The code slots move onto the red side, directly above the keypad, so guests look in one place while typing. The freed space on the left carries a bigger title and help for guests who have no code yet. Shown with all six characters in: Go turns solid white and pulses.",
    html: `
      <div class="eb" style="left:125px;top:230px">Guest code</div>
      <div class="t3" style="left:112px;top:280px;font-size:150px"><span class="l1">Your</span><span class="l2">code.</span></div>
      <div class="sub" style="left:125px;top:574px;width:640px">6 letters and numbers, from your SMS or your Wendy Fest pass.</div>
      <div class="help" style="left:125px;top:716px"><div class="q">${qr()}</div><i></i><div><em>No code yet?</em><br>Scan to register,<br>or ask our crew</div></div>
      <div class="ghostb" style="left:125px;top:888px">← Back</div>
      <div class="eb w" style="left:1080px;top:230px">Tap your code</div>
      <div class="msg" style="left:1560px;top:231px;color:#fff;width:267px;justify-content:flex-end">6 of 6 ✓</div>
      ${at(slots("K7M4QX", "onred").replace("repeat(6, 96px)", ""), "left:1080px;top:280px;width:747px;grid-template-columns:repeat(6, 1fr)")}
      ${at(kb(true, "short"), "left:1080px;top:436px")}
      <div class="act" style="left:1080px;top:830px"><button class="del">${delIcon}Delete</button><button class="go pulse">Go${arrow}</button></div>` },
};
const v = new URLSearchParams(location.search).get("v");
if (v) document.body.classList.add("one");
document.getElementById("board").innerHTML = Object.entries(OPTS).filter(([k]) => !v || k === v).map(([k, o]) =>
  `<section class="opt"><h2>${o.title}</h2><p>${o.note}</p><div class="fit"><div class="s" id="s-${k}">${chrome}${o.html}</div></div></section>`).join("");
function fit() { document.querySelectorAll(".fit").forEach(f => { f.firstElementChild.style.transform = `scale(${f.clientWidth / 1920})`; }); }
addEventListener("resize", fit); fit();
/* number keys start a new, slightly separated block */
document.querySelectorAll(".kb").forEach(k => { [...k.children].slice(24).forEach(b => b.style.marginTop = k.classList.contains("short") ? "10px" : "26px"); });
</script></body></html>
