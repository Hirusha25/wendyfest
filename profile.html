<!doctype html>
<html lang="en">
<head><script>fetch("./version.txt?" + Date.now(), { cache: "no-store" }).then((r) => r.text()).then((v) => { v = v.trim(); const u = new URL(location.href); if (v && v !== "mwjipwqo" && u.searchParams.get("v") !== v) { u.searchParams.set("v", v); location.replace(u); } }).catch(() => {});</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>[DEMO] My pass · Wendy Fest</title><meta name="theme-color" content="#CD2028"><link rel="icon" href="./assets/cameo.png"><link rel="stylesheet" href="./css/guest.css?v=mwjipwqo">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0M12 17v4m-4 0h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3M12 14v4m-4 2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z" fill="currentColor"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4M5 12v8h14v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
</head>
<body>
<div class="app">
  <header class="hdr" style="padding-bottom:150px">
    <div class="top"><img class="lockup" src="./assets/wendys-horiz-white.svg" alt="Wendy's"><div id="langbox"></div></div>
    <div class="eyebrow" style="margin-top:16px" data-t="profEyebrow">Your fest. Your stats.</div>
    <h1 class="display h2" style="font-size:clamp(40px,13vw,52px);margin-bottom:0" data-t="profTitle">My profile</h1>
  </header>
  <main class="body" style="gap:12px;padding-top:0;margin-top:-140px">
    <div class="stack" style="margin-top:0;margin-bottom:6px">
      <div class="back"><img src="./assets/cameo.png" alt=""><div class="tag" data-t="fest">Wendy Fest</div><div class="sub"><span data-t="colombo">Colombo</span><span class="b" data-t="launchWeek">Launch week</span></div></div>
      <div class="front"><div class="stripe"></div>
        <div class="top2"><img src="./assets/wendys-horiz.svg" alt="Wendy's"><div class="vr"></div><div><div class="t1" data-t="fest">Wendy Fest</div><div class="t2"><span data-t="participant">Participant</span> <span id="num">#0000</span></div></div></div>
        <div class="display name" id="name">…</div>
        <div class="meta"><div><div class="l" data-t="entryCode">Entry code</div><div class="c" id="code">······</div></div><div class="n"><span data-t="colombo">Colombo</span><b id="date">—</b></div></div>
      </div>
    </div>
    <div class="two"><button class="btn outline" id="dl"><svg width="20" height="20"><use href="#i-dl"/></svg><span data-t="savePass">Save pass</span></button><button class="btn outline" id="share"><svg width="20" height="20"><use href="#i-share"/></svg><span data-t="share">Share</span></button></div>
    <div class="lede" data-t="journey">Your fest journey</div>
    <div class="track"><div class="steps" id="journey"></div></div>
    <div class="statrow" id="stats"></div>
    <div id="reward"></div>
    <div id="roast"></div>
  </main>
  <div id="foot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="./js/demo-shim.js?v=mwjipwqo"></script><script src="./js/i18n.js?v=mwjipwqo"></script><script src="./js/app.js"></script>
<script>
  document.getElementById("langbox").innerHTML = langSwitcher(); document.getElementById("foot").outerHTML = brandFoot(); applyLang();
  const $ = (id) => document.getElementById(id);
  let P = null;
  const ic = (n) => `<svg width="20" height="20"><use href="#i-${n}"/></svg>`;
  function paint(p) {
    const parts = p.name.trim().split(/\s+/); const first = parts.shift(); const rest = parts.join(" ");
    $("name").innerHTML = `${esc(first)}${rest ? `<br><span class="o">${esc(rest)}</span>` : ""}`;
    $("num").textContent = "#" + String(p.number).padStart(4, "0"); $("code").textContent = p.code;
    $("date").textContent = new Date(p.joined + "Z").toLocaleDateString(window.lang === "en" ? "en-GB" : window.lang, { day: "numeric", month: "short" });
    const b = p.badges;
    const steps = [["star", true, "bRookie"], ["mic", b.screamer, "bScreamer"], ["trophy", b.winner, "bWinner"], ["cam", b.roasted, "bRoasted"]];
    const done = steps.filter((x) => x[1]).length;
    $("journey").style.setProperty("--p", `${Math.round(((done - 1) / 3) * 76)}%`);
    $("journey").innerHTML = steps.map(([i, on, k], idx) => `<div class="s ${on ? "on" : ""} ${idx === 3 ? "b" : ""}"><i>${ic(i)}</i><b>${t(k)}</b></div>`).join("");
    const s = p.screams[0], r = p.roasts[0];
    $("stats").innerHTML = `
      <div class="card2 red"><div class="top"><b>${t("scream")}</b>${ic("mic")}</div><div class="bot"><div class="v">${s ? s.score : "—"}<small>/100</small></div><div class="m">${s ? `${t("bWinnerD")}: ${s.loudness} · ${s.accuracy}` : t("scHint")}</div><span class="st ${s && s.won ? "win" : ""}">${s ? (s.won ? "🏆 " + t("won") : t("played")) : t("notPlayed")}</span></div></div>
      <div class="card2 blue"><div class="top"><b>${t("roast")}</b>${ic("cam")}</div><div class="bot"><div class="v">${r ? "🔥" : "—"}</div><div class="m">${r ? esc(r.title[window.lang] || r.title.en) : t("roHint")}</div><span class="st">${r ? t("roasted") : t("notRoasted")}</span></div></div>`;
    const win = p.screams.find((x) => x.won && x.coupon);
    $("reward").innerHTML = win ? `<div class="reward on"><div><div class="l">${t("reward")}</div><div class="v">${win.coupon.code}</div></div><div class="m">${esc(win.coupon.label)}<br>${t("rewardHow")}</div></div>`
      : `<div class="reward"><div><div class="l">${t("reward")}</div><div class="v">${t("locked")}</div></div><div class="m">${t("rewardHint")}<br>${esc(p.coupon.valueLabel)}</div></div>`;
    $("roast").innerHTML = r ? `<div class="lede">${t("yourRoast")}</div><div class="roastcard"><img src="${r.photo}" alt=""><div class="l">${esc(r.vibe || "")}</div><div class="t">${esc(r.title[window.lang] || r.title.en)}</div><p>${esc(r.roast[window.lang] || r.roast.en)}</p><a class="btn blue" style="height:48px;font-size:14px" href="${r.url}"><span>${t("viewRoast")}</span><svg class="arr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>` : "";
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  api("/api/me").then((p) => { P = p; paint(p); applyLang(); }).catch(() => location.href = "./register.html");
  document.addEventListener("langchange", () => P && paint(P));
  $("dl").onclick = async () => { if (!P) return; const c = await renderProfileCard(P); downloadCanvas(c, `wendyfest-${P.code}.png`); };
  $("share").onclick = async () => { if (!P) return; const c = await renderProfileCard(P); const f = await canvasToFile(c, `wendyfest-${P.code}.png`); shareLink({ title: "Wendy Fest", text: `I'm at Wendy Fest 🍔 #${P.code}`, url: P.profileUrl, file: f }); };
</script>
</body></html>
