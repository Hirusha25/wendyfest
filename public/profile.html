<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My profile · Wendy Fest</title><meta name="theme-color" content="#CD2028"><link rel="icon" href="/assets/cameo.png">
<link rel="stylesheet" href="/css/brand.css">
<style>
  .head { background: var(--red); color: #fff; padding-bottom: 70px; }
  .pcard { margin-top: -56px; padding: 0; overflow: hidden; }
  .pcard .top { background: var(--red); color: #fff; padding: 22px 22px 18px; position: relative; }
  .pcard .top .display { font-size: clamp(2.2rem, 10vw, 3rem); word-break: break-word; }
  .pcard .top .cameo { position: absolute; right: 16px; top: 14px; width: 64px; }
  .pcard .body { padding: 18px 22px 22px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; background: var(--gray-light); color: var(--gray); }
  .badge.on { background: var(--ink); color: #fff; }
  .badge.on.win { background: var(--blue); }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat .box { background: var(--cream-2); border-radius: 16px; padding: 14px; }
  .stat .display { font-size: 2.4rem; color: var(--red); }
  .sec { margin-top: 18px; }
  .sec h3 { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; color: var(--gray); margin-bottom: 10px; }
  .roast-p { background: var(--ink); color: #fff; border-radius: 18px; padding: 18px; }
  .roast-p img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body class="freckles">
  <div class="head on-red">
    <div class="wrap">
      <header class="topbar"><a href="/"><img class="logo" src="/assets/wendys-horiz-white.svg" alt="Wendy's"></a><div id="langbox"></div></header>
      <div class="eyebrow" style="opacity:.85" data-t="profile"></div>
      <h1 class="display" style="font-size:2.4rem;margin-top:4px">Wendy Fest</h1>
    </div>
  </div>
  <main class="wrap">
    <section class="card pcard rise" id="card">
      <div class="top">
        <div class="eyebrow" style="opacity:.85"><span data-t="participant"></span> <span id="num"></span></div>
        <div class="display" id="name" style="margin-top:6px">…</div>
        <div style="opacity:.85;font-size:.85rem;margin-top:8px"><span data-t="yourCode"></span>: <b id="code" style="letter-spacing:.14em"></b></div>
        <img class="cameo" src="/assets/cameo.png" alt="">
      </div>
      <div class="body stack">
        <div class="badges" id="badges"></div>
        <div class="actions">
          <button class="btn sm" id="dl" data-t="download"></button>
          <button class="btn sm ink" id="share" data-t="share"></button>
        </div>
      </div>
    </section>

    <section class="sec card rise-2">
      <h3 data-t="screamResult"></h3>
      <div id="scream"></div>
    </section>

    <section class="sec card rise-3">
      <h3 data-t="roastResult"></h3>
      <div id="roast"></div>
    </section>

    <div class="stack" style="margin:22px 0 10px">
      <a class="btn block" href="/scream" data-t="scream"></a>
      <a class="btn block ink" href="/roast" data-t="roast"></a>
    </div>
    <p class="foot"><span data-t="poweredBy"></span> · <span data-t="terms"></span></p>
  </main>
<script src="/js/i18n.js"></script><script src="/js/app.js"></script>
<script>
  document.getElementById("langbox").innerHTML = langSwitcher();
  let P = null;
  function paint(p) {
    document.getElementById("name").textContent = p.name;
    document.getElementById("num").textContent = "#" + String(p.number).padStart(4, "0");
    document.getElementById("code").textContent = p.code;
    const b = p.badges;
    document.getElementById("badges").innerHTML = [["bScreamer", b.screamer, ""], ["bWinner", b.winner, "win"], ["bRoasted", b.roasted, ""]].map(([k, on, cls]) => `<span class="badge ${on ? "on " + cls : ""}">${on ? "✓" : "○"} ${t(k)}</span>`).join("") + (!b.screamer && !b.roasted ? `<span class="badge on">★ ${t("bRookie")}</span>` : "");
    const s = p.screams[0];
    document.getElementById("scream").innerHTML = s ? `
      <div class="stat">
        <div class="box"><div class="eyebrow muted">${t("score")}</div><div class="display">${s.score}<span style="font-size:1rem;color:var(--gray)">/100</span></div><div class="muted" style="font-size:.8rem">${s.won ? "🏆 " + t("won") : t("lost")}</div></div>
        <div class="box"><div class="eyebrow muted">${t("loud")} · ${t("clear")}</div><div class="display" style="font-size:1.7rem">${s.loudness} · ${s.accuracy}</div><div class="muted" style="font-size:.8rem">${new Date(s.at + "Z").toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div></div>
      </div>
      ${s.coupon ? `<div class="coupon-box" style="margin-top:12px;border:2px solid var(--blush)"><div class="eyebrow muted">${t("reward")}</div><div class="code">${s.coupon.code}</div><div style="font-weight:600">${s.coupon.label}</div><div class="muted" style="font-size:.78rem;margin-top:4px">${t("rewardHow")} ${p.coupon.terms}</div></div>` : `<p class="muted" style="margin:12px 0 0">${t("noReward")}</p>`}`
      : `<p class="muted" style="margin:0">${t("notPlayed")}</p>`;
    const r = p.roasts[0];
    document.getElementById("roast").innerHTML = r ? `<div class="roast-p"><img src="${r.photo}" alt=""><div class="eyebrow" style="color:var(--blue)">${r.vibe || ""}</div><div class="display" style="font-size:1.5rem;margin:4px 0 8px">${r.title[window.lang] || r.title.en}</div><p style="margin:0 0 12px">${r.roast[window.lang] || r.roast.en}</p><a class="btn blue sm" href="${r.url}">${t("viewRoast")}</a></div>` : `<p class="muted" style="margin:0">${t("notRoasted")}</p>`;
  }
  api("/api/me").then((p) => { P = p; paint(p); applyLang(); }).catch(() => location.href = "/register");
  document.addEventListener("langchange", () => P && paint(P));
  document.getElementById("dl").onclick = async () => { if (!P) return; const c = await renderProfileCard(P); downloadCanvas(c, `wendyfest-${P.code}.png`); };
  document.getElementById("share").onclick = async () => { if (!P) return; const c = await renderProfileCard(P); const f = await canvasToFile(c, `wendyfest-${P.code}.png`); shareLink({ title: "Wendy Fest", text: `I'm at Wendy Fest 🍔 #${P.code}`, url: P.profileUrl, file: f }); };
</script>
</body></html>
