<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · Wendy Fest</title><meta name="theme-color" content="#CD2028"><link rel="icon" href="/assets/cameo.png">
<link rel="stylesheet" href="/css/brand.css">
<style>
  .head { background: var(--red); color: #fff; padding-bottom: 54px; }
  .head .display { font-size: clamp(2.6rem, 12vw, 3.8rem); }
  .form-card { margin-top: -40px; }
  .done .code-box { animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both; }
</style>
</head>
<body class="freckles">
  <div class="head on-red">
    <div class="wrap">
      <header class="topbar"><a href="/"><img class="logo" src="/assets/wendys-horiz-white.svg" alt="Wendy's"></a><div id="langbox"></div></header>
      <div class="eyebrow" style="opacity:.85" data-t="brand">Wendy Fest</div>
      <h1 class="display" style="margin-top:6px" data-t="registerShort">Register</h1>
      <p class="lead" style="opacity:.95;margin:10px 0 0" data-t="sub"></p>
    </div>
  </div>

  <main class="wrap">
    <form id="form" class="card form-card stack" novalidate>
      <div class="field"><label for="name" data-t="name">Your name</label><input class="input" id="name" name="name" autocomplete="name" maxlength="60" required></div>
      <div class="field"><label for="phone" data-t="phone">Mobile number</label><input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX" required><div class="help" data-t="phoneHelp"></div></div>
      <div class="field"><label for="email"><span data-t="email">Email</span> <span class="opt">(<span data-t="optional">optional</span>)</span></label><input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="email"></div>
      <div class="field"><label for="dob" data-t="dob">Date of birth</label><input class="input" id="dob" name="dob" type="date" max="2015-12-31" min="1930-01-01"></div>
      <label class="check"><input type="checkbox" id="consent" checked><span data-t="consent"></span></label>
      <button class="btn block xl" id="submit" type="submit" data-t="submit">Get my code</button>
      <p class="help center" data-t="privacy"></p>
    </form>

    <section id="done" class="hidden stack" style="margin-top:-40px">
      <div class="ticket pad done" style="padding:28px 22px">
        <div class="ticket-inner"></div>
        <div class="eyebrow" style="opacity:.85" data-t="yourCode">Your code</div>
        <div class="code-box" style="margin:12px 0"><div class="code" id="code">------</div></div>
        <p class="lead" style="margin:0 0 6px" data-t="showCode"></p>
        <p style="margin:0;opacity:.85;font-size:.9rem" data-t="codeSms"></p>
      </div>
      <a class="btn block xl" href="/profile" data-t="openProfile">Open my profile</a>
      <div class="row" style="justify-content:center"><button class="btn sm ghost" id="resend" data-t="resend">Resend SMS</button></div>
    </section>
    <p class="foot" data-t="terms"></p>
  </main>

<script src="/js/i18n.js"></script><script src="/js/app.js"></script>
<script>
  document.getElementById("langbox").innerHTML = langSwitcher(); applyLang();
  const form = document.getElementById("form");
  const next = new URLSearchParams(location.search).get("next");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = form.name.value.trim(), phone = form.phone.value.trim();
    form.name.classList.toggle("err", name.length < 2); form.phone.classList.toggle("err", !/^(\+?94|0)?7\d{8}$/.test(phone.replace(/[\s-]/g, "")));
    if (name.length < 2) return toast(t("errName"));
    if (!/^(\+?94|0)?7\d{8}$/.test(phone.replace(/[\s-]/g, ""))) return toast(t("errPhone"));
    const btn = document.getElementById("submit"); btn.disabled = true; btn.textContent = t("sending");
    try {
      const r = await api("/api/register", { method: "POST", body: { name, phone, email: form.email.value.trim(), dob: form.dob.value, lang: window.lang, consentMarketing: document.getElementById("consent").checked } });
      document.getElementById("code").textContent = r.code;
      form.classList.add("hidden"); document.getElementById("done").classList.remove("hidden");
      if (next) document.querySelector("#done a.btn").href = "/" + next;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      toast(err.message === "phone" ? t("errPhone") : err.message === "name" ? t("errName") : t("errGeneric"));
      btn.disabled = false; btn.textContent = t("submit");
    }
  });
  document.getElementById("resend").addEventListener("click", async () => { await api("/api/me/resend", { method: "POST" }); toast("SMS sent"); });
</script>
</body></html>
