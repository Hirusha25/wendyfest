<style>
  /* the roast card hangs from a lanyard, sways and turns a little, like on the kiosk */
  .hang { position:relative; width:min(74vw, 310px); margin:64px auto 0; transform-origin:50% -14%; animation:hangIn 2.8s cubic-bezier(.3, .6, .35, 1) both, hangSway 5.6s ease-in-out 2.8s infinite alternate, hangTurn 7.4s ease-in-out infinite alternate; }

  .hang img.hcard { display:block; width:100%; aspect-ratio:9 / 16; object-fit:cover; border-radius:12px; background:#1E1B1B; box-shadow:1px 1px 0 #EDE6DB, 2px 2px 0 #D9D1C5, 3px 3px 0 #C4BBAE, 4px 4px 0 #A99F92, 5px 6px 0 #5E564D, 14px 24px 36px rgba(0,0,0,.45), 3px 6px 10px rgba(0,0,0,.3); }
  .hang::after { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none; mix-blend-mode:screen; background:linear-gradient(112deg, transparent 38%, rgba(255,255,255,.07) 44%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.07) 56%, transparent 62%) 0 0 / 280% 100% no-repeat; animation:hangSheen 7.4s ease-in-out infinite alternate; }

  /* until the finished card is drawn: a dark card with a soft pulse and a short line, never the raw photo */

  .hdr { z-index:5; padding:12px 16px; background:linear-gradient(180deg, #23B4F0, #0590C6); border-bottom:4px solid #fff; border-radius:0; overflow:visible; box-shadow:0 6px 14px rgba(0,0,0,.3); }

  body[data-card="red"] { --sb:linear-gradient(160deg, #E5303A, #A9161F); --st:#fff; --sh:#fff; --sm:rgba(255,255,255,.82); --sd:rgba(255,255,255,.55); --kw:#FFE08A; --kb:transparent; --tb:rgba(255,255,255,.55); --ta:#029CD4; --tas:#01476A; }
  body[data-card="blue"] { --sb:linear-gradient(160deg, #23B4F0, #0A7FBC); --st:#fff; --sh:#fff; --sm:rgba(255,255,255,.85); --sd:rgba(255,255,255,.6); --kw:#FFE08A; --kb:transparent; --tb:rgba(255,255,255,.6); --ta:#D8232D; --tas:#7E0F16; }
  body[data-card="paper"] { --sb:linear-gradient(160deg, #FBF5EA, #E8DCC8); --st:#1F1A1A; --sh:#0A6FA6; --sm:#6B6060; --sd:rgba(227,32,43,.85); --kw:#D8232D; --kb:transparent; --tb:rgba(30,27,27,.3); --ta:#029CD4; --tas:#01476A; }
  .lower .two { margin-top:18px; gap:12px; }
  .lower .two .btn { height:56px; font-size:15px; border-radius:999px; }
  .lower .two .btn.outline { background:transparent; color:#fff; border:2.5px solid #fff; box-shadow:none; }
  .lower .two .btn:not(.outline) { box-shadow:0 5px 0 #7E0F16; }
  .lower a.link { display:inline-block; padding:12px 0 4px; color:#fff; opacity:.8; }
  .body + .brandfoot { margin-top:0; } .brandfoot, .brandfoot * { background-color:#0590C6; color:#fff; }
  /* until a colour is picked, the circles take turns to press in and pop, so it is clear they can be tapped (owner) */
  #swatch.hint button { animation:swTap 2.8s ease-in-out infinite; } #swatch.hint button:nth-of-type(2) { animation-delay:.45s; } #swatch.hint button:nth-of-type(3) { animation-delay:.9s; } #swatch.hint button:nth-of-type(4) { animation-delay:1.35s; }
  @keyframes swTap { 0%, 22%, 100% { scale:1; filter:none; } 6% { scale:.82; } 13% { scale:1.24; filter:brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,.9)); } }
  @media (prefers-reduced-motion: reduce) { #swatch.hint button { animation:none; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="./js/demo-shim.js?v=mwzys3d3"></script><script src="./js/i18n.js?v=mwzys3d3"></script><script src="./js/app.js"></script><script src="./js/roast-card.js"></script>
<script>
  document.getElementById("foot").outerHTML = brandFoot();
  const card = async () => { try { return await roastCard(R, window.lang, R.theme); } catch (e) { console.warn(e); return renderRoastCard(R, window.lang); } };
  const token = new URLSearchParams(location.search).get("t");
  let R = null;
  function paint() {
    if (!R) return;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.l === window.lang));
    document.getElementById("title").textContent = R.title[window.lang] || R.title.en;
    document.getElementById("body").innerHTML = boldKeywords(R.roast[window.lang] || R.roast.en, roastKeys(R));
    document.getElementById("vibe").textContent = R.vibe || "";
    drawCard(); applyLang();
  }
  // The card on the page: the photo shows first, then the finished card replaces it. It is redrawn when the language or colour changes.
  let drawJob = 0;
  function drawCard() {
    const img = document.getElementById("photo"), sw = document.getElementById("swatch"), job = ++drawJob;
    const hang = img.closest(".hang"); if (!img.getAttribute("src")) hang.classList.add("wait");   // the raw photo is never shown: a dark card waits until the finished card is drawn (owner)
    document.body.dataset.card = R.theme;
    sw.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.c === R.theme)); sw.classList.add("busy");
    card().then((c) => { if (job === drawJob) { img.src = c.toDataURL("image/jpeg", .9); hang.classList.remove("wait"); } }).catch((e) => console.warn(e)).finally(() => { if (job === drawJob) sw.classList.remove("busy"); });
  }
  document.querySelectorAll("#swatch button").forEach((b) => b.onclick = () => { if (!R) return; document.getElementById("swatch").classList.remove("hint"); R.theme = b.dataset.c; drawCard();
    fetch(`/api/roast/${token}/theme`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ theme: R.theme }) }).catch(() => {}); });
  document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => setLang(b.dataset.l));
  document.addEventListener("langchange", paint);
  api(`/api/roast/${token}`).then((r) => { R = r; if (!new URLSearchParams(location.search).get("lang") && !localStorage.getItem("wf_lang")) window.lang = r.lang; paint(); }).catch(() => { document.getElementById("title").textContent = "This roast went cold."; });
  document.getElementById("dl").onclick = async () => { const c = await card(); downloadCanvas(c, `wendys-roast-${R.name}.png`); };
  document.getElementById("share").onclick = async () => { const c = await card(); const f = await canvasToFile(c, "wendys-roast.png"); shareLink({ title: "Roasted by Wendy's", text: t("roastShare"), url: R.url, file: f }); };
</script>
