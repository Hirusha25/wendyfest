<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>[DEMO] Roasted by Wendy's · Wendy Fest</title><meta name="theme-color" content="#CD2028"><link rel="icon" href="./assets/cameo.png">
<meta property="og:title" content="I just got roasted by Wendy's 🔥"><meta property="og:description" content="Wendy Fest · Sri Lanka">
<link rel="stylesheet" href="./css/guest.css?v=mwgr0k3c">
</head>
<body>
<div class="app">
  <header class="hdr" style="padding-bottom:70px">
    <div class="top"><img class="lockup" src="./assets/wendys-horiz-white.svg" alt="Wendy's"><div class="rtabs" id="tabs"><button data-l="en">EN</button><button data-l="si">සිං</button><button data-l="ta">தமிழ்</button></div></div>
    <div class="eyebrow" style="margin-top:16px" data-t="roastedBy">Roasted by Wendy’s</div>
    <h1 class="display h2" id="who">…</h1>
  </header>
  <main class="body" style="padding-top:0;margin-top:-56px">
    <div class="photo rise"><img id="photo" alt=""></div>
    <div class="rpaper rise-2">
      <div class="vibe" id="vibe"></div>
      <h2 class="display rtitle" id="title">…</h2>
      <p class="rbody" id="body"></p>
      <div class="sig">— Wendy’s, <span data-t="fest">Wendy Fest</span></div>
    </div>
    <div class="two rise-3"><button class="btn outline" id="dl" data-t="download">Download</button><button class="btn" id="share" style="height:52px;font-size:15px" data-t="share">Share</button></div>
    <a class="link" href="./index.html" style="padding:6px 0 10px" data-t="tryIt">Get roasted too</a>
  </main>
  <div id="foot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="./js/demo-shim.js?v=mwgr0k3c"></script><script src="./js/i18n.js?v=mwgr0k3c"></script><script src="./js/app.js"></script>
<script>
  document.getElementById("foot").outerHTML = brandFoot();
  const token = new URLSearchParams(location.search).get("t");
  let R = null;
  function paint() {
    if (!R) return;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.l === window.lang));
    document.getElementById("who").textContent = R.name.split(" ")[0];
    document.getElementById("title").textContent = R.title[window.lang] || R.title.en;
    document.getElementById("body").textContent = R.roast[window.lang] || R.roast.en;
    document.getElementById("vibe").textContent = R.vibe || "";
    if (R.photo) document.getElementById("photo").src = R.photo;
    applyLang();
  }
  document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => setLang(b.dataset.l));
  document.addEventListener("langchange", paint);
  api(`/api/roast/${token}`).then((r) => { R = r; if (!new URLSearchParams(location.search).get("lang") && !localStorage.getItem("wf_lang")) window.lang = r.lang; paint(); }).catch(() => { document.getElementById("title").textContent = "This roast went cold."; });
  document.getElementById("dl").onclick = async () => { const c = await renderRoastCard(R, window.lang); downloadCanvas(c, `wendys-roast-${R.name}.png`); };
  document.getElementById("share").onclick = async () => { const c = await renderRoastCard(R, window.lang); const f = await canvasToFile(c, "wendys-roast.png"); shareLink({ title: "Roasted by Wendy's", text: t("roastShare"), url: R.url, file: f }); };
</script>
</body></html>
