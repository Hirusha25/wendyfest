<style>
  /* The LED wall: approved roasts, one at a time, shuffled. The look is the owner's landscape "ROASTED." pass (Nov 2026): a dark card hanging
     from a blue lanyard on the red stage, photo on the left with the name on a red tape, the roast on cream strips with the last line on blue.
     Everything is drawn inside a 16:9 box that is scaled to the screen: 1em = 1% of the box's width, so sizes below are in em. */
  html, body { height: 100%; margin: 0; overflow: hidden; cursor: none; background: #B8141C; }
  body { font-family: Poppins, 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif; color: #fff; }
  #bg { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 40%, #EE2A33 0%, #D81E27 45%, #B0141C 100%); }
  #bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.07) 1.2px, transparent 1.6px) 0 0 / 22px 22px; -webkit-mask: linear-gradient(180deg, transparent 20%, #000 100%); mask: linear-gradient(180deg, transparent 20%, #000 100%); }
  #top { position: fixed; left: 0; right: 0; top: 0; height: 5.9vh; background: linear-gradient(180deg, #18A6E8, #0C8FD3); box-shadow: 0 1.4vh 0 #F6F0E6, 0 2.7vh 0 #D8232D, 0 3.5vh 0 #F6F0E6, 0 4.6vh 3vh rgba(60,0,8,.35); z-index: 1; }
  .stage { position: fixed; left: 50%; top: 50%; width: 100em; height: 56.25em; margin: -28.125em 0 0 -50em; font-size: min(1vw, 1.7778vh); z-index: 2; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; pointer-events: none; }
  .slide.on { opacity: 1; }

  /* the pass hangs from the lanyard and sways a little */
  .pass { position: absolute; left: 3.8em; top: 7.9em; width: 92.4em; height: 45.6em; transform-origin: 50% -6em; }
  /* Slideshow (owner, Nov 2026): the pass on screen unhooks and falls away, then the next one drops in on its lanyard, bounces, and settles into a slow sway. */
  .slide.on .pass { animation: passIn 1.5s cubic-bezier(.3, .6, .35, 1) both, sway 6s ease-in-out 1.5s infinite alternate; }
  @keyframes passIn { 0% { translate: 0 -64em; rotate: -4deg; } 38% { translate: 0 1.4em; rotate: 2deg; } 55% { translate: 0 -.6em; rotate: -1.3deg; } 72% { translate: 0 .2em; rotate: .7deg; } 88% { rotate: -.4deg; } 100% { translate: 0 0; rotate: -.25deg; } }
  .slide.out { opacity: 1; z-index: 1; transition: none; }
  .slide.out .pass { animation: passOut .75s cubic-bezier(.55, 0, .85, .35) both; }
  @keyframes passOut { 0% { translate: 0 0; rotate: -.25deg; } 22% { translate: 0 -1.6em; rotate: 1.6deg; } 100% { translate: 3em 72em; rotate: 11deg; } }
  #prog { position: fixed; left: 0; right: 0; bottom: 0; height: .6vh; z-index: 4; background: rgba(0,0,0,.18); } #prog i { display: block; height: 100%; background: #F6F0E6; opacity: .8; transform-origin: 0 50%; transform: scaleX(0); }
  @keyframes sway { from { rotate: -.25deg; } to { rotate: .25deg; } }
  .lany { position: absolute; left: 50%; top: -9.6em; width: 6em; height: 11em; translate: -50% 0; z-index: 5; overflow: visible; filter: drop-shadow(0 .5em .6em rgba(0,0,0,.4)); }
  .pcard { position: absolute; inset: 0; border-radius: 2.6em; overflow: hidden; background: linear-gradient(150deg, #262121 0%, #151212 45%, #0C0A0A 100%); border: .22em solid #F6F0E6;
    box-shadow: .12em .12em 0 #EDE6DB, .24em .24em 0 #D9D1C5, .36em .36em 0 #A99F92, .5em .6em 0 #5E564D, 0 2.6em 4em rgba(40,0,6,.55), inset 0 0 0 .1em rgba(255,255,255,.08); }
  /* red halftone dots in two corners, and a red slanted band with a blue and a cream edge running behind the roast */
  .pcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, #E3202B .17em, transparent .2em) 0 0 / .78em .78em;
    -webkit-mask: radial-gradient(34em 26em at 100% 4%, #000 0, transparent 70%), radial-gradient(40em 22em at 62% 108%, #000 0, transparent 72%); mask: radial-gradient(34em 26em at 100% 4%, #000 0, transparent 70%), radial-gradient(40em 22em at 62% 108%, #000 0, transparent 72%); opacity: .9; }
  .band { position: absolute; left: -4em; top: 27em; width: 104em; height: 12em; rotate: -4.6deg; background: linear-gradient(180deg, #F02C36, #C81B24); box-shadow: 0 -.55em 0 #F6F0E6, 0 -1.2em 0 #18A6E8, 0 1em 2em rgba(0,0,0,.35); }
  .sheen { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(112deg, transparent 40%, rgba(255,255,255,.06) 46%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.06) 54%, transparent 60%) 0 0 / 280% 100% no-repeat; animation: sheen 7s ease-in-out infinite alternate; z-index: 6; border-radius: 2.6em; }
  @keyframes sheen { from { background-position: 115% 0; } to { background-position: -15% 0; } }

  /* photo: a cream frame, tilted a touch; the guest's head is kept inside by frame() */
  .photo { position: absolute; left: 5.1em; top: 2.5em; width: 34.6em; height: 33.4em; rotate: -1.6deg; border-radius: 1.9em; padding: .5em; box-sizing: border-box; background: linear-gradient(160deg, #FFFBF3, #E4D9C5); box-shadow: 0 1.4em 2.6em rgba(0,0,0,.55), 0 .3em 0 rgba(0,0,0,.25); z-index: 2; }
  .photo .win { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 1.45em; background: #2A2626; }
  .photo img { position: absolute; display: block; max-width: none; }

  .tape b { font: italic 900 4.5em/1 'Barlow Semi Condensed', 'Barlow Condensed', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif; text-transform: uppercase; letter-spacing: .02em; color: #FFF8EC; text-shadow: 0 .06em 0 rgba(90,0,10,.6); white-space: nowrap; }
  /* Wendy looks in from the bottom left corner. Her picture is a crop (cut flat at the top, the bottom and one side), so it is turned to put the cut side and the
     bottom under the card's edge, and the flat top of her hair is rounded off with a mask; the white outline is drawn after that, so it follows the smooth shape. */
  .wendy { position: absolute; left: -.5em; bottom: -4.6em; width: 16.5em; height: 16.5em; z-index: 4; filter: drop-shadow(.2em 0 0 #fff) drop-shadow(-.2em 0 0 #fff) drop-shadow(0 .2em 0 #fff) drop-shadow(0 -.2em 0 #fff) drop-shadow(.3em .5em .5em rgba(0,0,0,.35)); }
  .wendy img { display: block; width: 100%; height: 100%; transform: scaleX(-1); -webkit-mask: radial-gradient(ellipse 43% 41% at 69% 49%, #000 99.2%, transparent 100%), linear-gradient(#000, #000) 0 100% / 100% 51% no-repeat; mask: radial-gradient(ellipse 43% 41% at 69% 49%, #000 99.2%, transparent 100%), linear-gradient(#000, #000) 0 100% / 100% 51% no-repeat; }

  /* right side: logos, ROASTED., the roast on strips, the hashtag */
  .logos { position: absolute; left: 44em; width: 44.5em; top: 1.5em; height: 7.2em; display: flex; align-items: center; justify-content: center; gap: 1.5em; z-index: 3; }
  .logos img.w { height: 4.9em; } .logos i { width: .14em; height: 4.6em; background: rgba(255,255,255,.5); } .logos img.f { height: 6.9em; }
  .roasted { position: absolute; left: 43.4em; width: 47em; top: 8.5em; height: 14.6em; z-index: 3; display: flex; align-items: flex-end; justify-content: center; rotate: -4.6deg; }   /* ROASTED. stands on top of the band's two lines, at the same lean, and never crosses them; the roast is packed inside the red band only (owner) */
  .roasted b { display: block; font: italic 900 11.6em/.8 'Barlow Semi Condensed', 'Barlow Condensed', sans-serif; letter-spacing: -.012em; transform: scaleY(1.3); transform-origin: 50% 100%; white-space: nowrap; color: #E3202B;
    background: linear-gradient(180deg, #FF4651 0%, #E3202B 52%, #BE1A23 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; -webkit-text-stroke: .012em rgba(255,255,255,.75);
    filter: drop-shadow(.022em .03em 0 #7E1016) drop-shadow(.022em .03em 0 #4E0A0E) drop-shadow(0 .09em .1em rgba(0,0,0,.5)); padding: 0 .08em; }
  .strips { position: absolute; left: 44.6em; width: 44.6em; top: 26.1em; height: 10.6em; rotate: -4.6deg; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .34em; }
  .strips span { display: block; white-space: nowrap; font: 900 1em/1 'Barlow Condensed', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif; text-transform: uppercase; letter-spacing: .01em; color: #191616; background: linear-gradient(180deg, #FFFBF3, #EFE6D6); padding: .14em .5em .1em; box-shadow: .1em .12em 0 rgba(0,0,0,.35); }

  .tag { position: absolute; right: 1.2em; bottom: .62em; font: italic 900 3em/1 Poppins, sans-serif; color: #fff; text-shadow: 0 .09em 0 #7E1016, 0 .2em .4em rgba(0,0,0,.5); z-index: 3; }

  /* Colours (owner, Nov 2026): the same pass in four colours, changed at random from roast to roast. "dark" is the base look above;

  .win.bg-d::before { background: radial-gradient(circle, #6E0C12 .2em, transparent .24em) 0 0 / .86em .86em; -webkit-mask: radial-gradient(60% 50% at 0 0, #000 0, transparent 78%), radial-gradient(62% 52% at 100% 100%, #000 0, transparent 78%), radial-gradient(40% 34% at 100% 0, #000 0, transparent 80%); mask: radial-gradient(60% 50% at 0 0, #000 0, transparent 78%), radial-gradient(62% 52% at 100% 100%, #000 0, transparent 78%), radial-gradient(40% 34% at 100% 0, #000 0, transparent 80%); opacity: .8; }

  .win.bg-f .ph { filter: drop-shadow(0 0 .35em rgba(255,255,255,.9)) drop-shadow(0 0 1.3em rgba(160,225,255,.75)); }

  /* everything arrives in order: photo, name, ROASTED. stamps in, then the roast line by line */

  #pinbox.on { display: flex; }

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="./js/demo-shim.js?v=mx07acan"></script><script src="./js/app.js?v=mx07acan"></script><script src="./js/roast-card.js"></script>
<script>
  const $ = (id) => document.getElementById(id), esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let LIST = [], QUEUE = [], SECONDS = 15, cur = 0, last = "", timer = null, started = false;
  // The pass changes colour from roast to roast: all four are used once, in a random order, before any comes round again. ?theme=blue (or dark, red, paper) holds one colour, for checking.
  const THEMES = ["dark", "blue", "red", "paper"], HOLD = new URLSearchParams(location.search).get("theme"); let themeBag = [], lastTheme = "";
  function nextTheme() { if (THEMES.includes(HOLD)) return HOLD; if (!themeBag.length) { themeBag = THEMES.slice().sort(() => Math.random() - .5); if (themeBag[0] === lastTheme) themeBag.push(themeBag.shift()); } return (lastTheme = themeBag.shift()); }

  function draw(el, r) {
    const lang = r.roast[r.lang] ? r.lang : "en", theme = nextTheme();
    el.className = "slide t-" + theme + (el.classList.contains("on") ? " on" : ""); el.dataset.theme = theme;
    el.innerHTML = `<div class="pass">${$("lany").innerHTML}<div class="pcard"><div class="band"></div>
      <div class="photo"><div class="win"><img class="ph" src="${esc(r.photo)}" alt=""></div></div><div class="tape"><b>${esc(r.name)}</b></div><div class="wendy"><img src="./assets/roast-wendy.png" alt=""></div>
      <div class="logos"><img class="w" src="./assets/${theme === "paper" ? "wendys-horiz.svg" : "wendys-horiz-white.svg"}" alt="Wendy's"><i></i><img class="f" src="./assets/wendyfest-logo.png" alt="Wendy Fest"></div>
      <div class="roasted"><b>ROASTED.</b></div><div class="strips"></div><div class="tag">#RoastedByWendy</div></div><div class="sheen"></div></div>`;
    el.querySelector(".win .ph").onload = () => frame(el, r);   // in case the picture was not ready yet

  }
  // The roast on strips: wrapped to the width of the column and made as big as fits (3 lines when short, up to 5 when long). The last line is the blue one.
  function strips(el, text) {

    const local = /[஀-௿඀-෿]/.test(text), t = String(text || "").trim().toUpperCase(), fam = "'Barlow Condensed', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif";
    const wide = (l, px) => { cx.font = `900 ${px}px ${fam}`; return cx.measureText(l).width + px; };   // the strip's own side padding is about one letter height

    for (; size > 1.3; size -= .1) { lines = wrap(size * E); const h = lines.length * size * E * 1.22 + (lines.length - 1) * .34 * E; if (h <= maxH && lines.length <= 5 && lines.every((l) => wide(l, size * E) <= maxW)) break; }

    if (lines.length > 1 && lines.at(-1).split(" ").length === 1 && lines.at(-2).split(" ").length > 2) { const a = lines.at(-2).split(" "); lines[lines.length - 1] = a.pop() + " " + lines.at(-1); lines[lines.length - 2] = a.join(" "); }
    box.innerHTML = lines.map((l, i) => `<span class="${i === lines.length - 1 ? "last" : ""}" style="font-size:${size.toFixed(2)}em;--n:${i}">${esc(l)}</span>`).join("");
  }
  function fitName(el) { const b = el.querySelector(".tape b"), tp = el.querySelector(".tape"), w = (tp.clientWidth - parseFloat(getComputedStyle(tp).paddingLeft)) * .9; let s = 4.5; b.style.fontSize = s + "em"; while (b.scrollWidth > w && s > 2) { s -= .15; b.style.fontSize = s + "em"; } }
  // Place the photo in its window so the guest's head (hair included) is inside it: head near the top, centred, and zoomed in when the guest is far from the camera.
  // FOCUS holds where the head is (found by the same cut-out engine as the roast card). Without it the photo is simply centred, a little above the middle.
  // Backdrop pictures by card colour (files in public/assets/wall-bg/). When a card colour has one, the guest is cut out of their photo and placed on it;
  // with several, each roast keeps the same one. A card colour with no picture shows the photo as it was taken.
  const BACKS = { dark: ["black.jpg"], blue: ["blue.jpg"], red: ["red.jpg"], paper: ["cream.jpg"] }, HAS_BACKS = Object.values(BACKS).some((a) => a.length);
  const backFor = (theme, token) => { const a = BACKS[theme] || []; if (!a.length) return ""; let h = 0; for (const ch of String(token)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return a[h % a.length]; };
  const FOCUS = new Map(), CUTS = new Map(), BG = (new URLSearchParams(location.search).get("bg") || "").toLowerCase();   // ?bg=a|b|c: cut the guest out and use that backdrop
  function frame(el, r) {
    const win = el.querySelector(".win"), img = win.querySelector(".ph"), fw = win.clientWidth, fh = win.clientHeight, iw = img.naturalWidth || 16, ih = img.naturalHeight || 9, F = FOCUS.get(r.token);
    const C = CUTS.get(r.token);
    const back = C && !["a", "b", "c", "d", "e", "f"].includes(BG) ? backFor(BG.startsWith("all") ? (BG.slice(4) || "dark") : el.dataset.theme, r.token) : "";   // ?bg=all shows the first picture on every card colour, for checking
    if (back) { if (!win.querySelector(".bk")) win.insertAdjacentHTML("afterbegin", `<img class="bk" alt="" src="./assets/wall-bg/${back}">`); }
    if (C && (back || ["a", "b", "c", "d", "e", "f"].includes(BG))) {
      win.classList.add("cut", back ? "bg-img" : "bg-" + BG); if (back) win.classList.add("bk-" + back.replace(/\..*$/, "")); if (img.getAttribute("src") !== C.url) { img.onload = null; img.src = C.url; }
      const hh = C.hy1 - C.hy0, hw = C.hx1 - C.hx0, pad = hh * .12, headTop = BG === "c" ? -.07 : .1;   // c: the hair rises above the frame
      let s = Math.min((.46 * fh) / hh, (fw * .62) / hw); s = Math.max(s, (fh * (1 - headTop)) / (C.h - (C.hy0 - pad)));   // big enough that the body reaches the bottom edge
      let left = fw / 2 - ((C.hx0 + C.hx1) / 2) * s; if (C.cutLeft) left = Math.min(left, 0); if (C.cutRight) left = Math.max(left, fw - C.w * s);   // a side the camera cut off stays against the frame
      img.style.width = C.w * s + "px"; img.style.height = C.h * s + "px"; img.style.left = left + "px"; img.style.top = fh * headTop - (C.hy0 - pad) * s + "px"; win.dataset.focus = "cut"; return;
    }
    const s0 = Math.max(fw / iw, fh / ih); let s = s0, left = (fw - iw * s) / 2, top = (fh - ih * s) * .3;
    if (F) {
      const hw = F.hx1 - F.hx0, hh = F.hy1 - F.hy0, pad = hh * .16;   // room above the hair
      s = Math.max(s0, Math.min(s0 * 2.4, (.42 * fh) / hh, (fw * .7) / hw));   // head a bit under half of the window, never wider than it
      left = fw / 2 - ((F.hx0 + F.hx1) / 2) * s; top = fh * .09 - (F.hy0 - pad) * s;
      top = Math.min(top, -(F.hy0 - pad) * s);   // the top of the hair is never above the window (when the photo itself has it)
    }
    left = Math.min(0, Math.max(fw - iw * s, left)); top = Math.min(0, Math.max(fh - ih * s, top));
    img.style.width = iw * s + "px"; img.style.height = ih * s + "px"; img.style.left = left + "px"; img.style.top = top + "px";
    win.dataset.focus = F ? "1" : "0";
  }
  const findFocus = (r) => FOCUS.has(r.token) || !window.roastCard ? Promise.resolve() : Promise.race([roastCard.focus(r.photo).then((F) => { FOCUS.set(r.token, F); return BG || HAS_BACKS ? roastCard.cut(r.photo).then((C) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = C.url; CUTS.set(r.token, C); })) : null; }), new Promise((res) => setTimeout(res, 9000))]).catch(() => {});
  function nextRoast() {
    if (!QUEUE.length) { QUEUE = LIST.slice(); for (let i = QUEUE.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [QUEUE[i], QUEUE[j]] = [QUEUE[j], QUEUE[i]]; } if (QUEUE.length > 1 && QUEUE[0].token === last) QUEUE.push(QUEUE.shift()); }
    return QUEUE.shift();
  }
  function show() {
    clearTimeout(timer);
    if (!LIST.length) { started = false; try { $("prog-i").getAnimations().forEach((a) => a.cancel()); } catch {} $("hold").classList.add("on"); $("s0").classList.remove("on"); $("s1").classList.remove("on"); return; }
    if (started && LIST.length === 1 && LIST[0].token === last && document.querySelector(".slide.on")) { timer = setTimeout(show, SECONDS * 1000); return; }   // only one roast approved: it simply stays up
    const r = nextRoast(); if (!r) return; last = r.token;
    const img = new Image(), go = () => { const el = $("s" + (cur ^= 1)), old = $("s" + (cur ^ 1)), wasOn = old.classList.contains("on"); draw(el, r); $("hold").classList.remove("on");
      // the pass on screen falls away first, then the new one drops in
      old.classList.remove("on"); if (wasOn) { old.classList.add("out"); setTimeout(() => old.classList.remove("out"), 800); }
      setTimeout(() => { el.classList.add("on"); document.body.dataset.theme = el.dataset.theme; }, wasOn ? 480 : 0);
      try { $("prog-i").getAnimations().forEach((a) => a.cancel()); $("prog-i").animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: SECONDS * 1000, fill: "forwards" }); } catch {}
      started = true; timer = setTimeout(show, SECONDS * 1000); };
    img.onload = () => findFocus(r).then(go); img.onerror = () => { timer = setTimeout(show, 600); }; img.src = r.photo;   // a photo that will not load is skipped
  }
  async function refresh() {
    let res; try { res = await fetch("/api/wall", { cache: "no-store" }); } catch { return; }   // offline for a moment: keep showing what we have
    if (res.status === 401) { $("pinbox").classList.add("on"); document.body.style.cursor = "auto"; return; }
    if (!res.ok) return; const d = await res.json(); $("pinbox").classList.remove("on"); document.body.style.cursor = "";
    SECONDS = Math.min(120, Math.max(8, Number(d.seconds) || 15));   // the card takes about 3 seconds to arrive, so under 8 nobody could read it
    const tokens = new Set(d.roasts.map((r) => r.token)); LIST = d.roasts; QUEUE = QUEUE.filter((r) => tokens.has(r.token));
    const fresh = d.roasts.filter((r) => !window.SEEN || !window.SEEN.has(r.token)); if (window.SEEN && fresh.length) QUEUE.unshift(...fresh);   // a newly approved roast is shown next

  }
  async function unlock() { const r = await fetch("/api/kiosk/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin").value }) }); if (r.ok) { $("pin").value = ""; refresh(); } else { $("pin").value = ""; $("pin").placeholder = "Wrong PIN"; } }
  $("pin-go").onclick = unlock; $("pin").addEventListener("keydown", (e) => e.key === "Enter" && unlock());
  addEventListener("resize", () => { const el = document.querySelector(".slide.on"), r = LIST.find((x) => x.token === last); if (el && r) { frame(el, r); strips(el, r.roast[r.roast[r.lang] ? r.lang : "en"]); fitName(el); } });

  Promise.all(["900 60px 'Barlow Condensed'", "italic 900 60px 'Barlow Semi Condensed'", "italic 900 60px Poppins"].map((f) => document.fonts.load(f).catch(() => {}))).then(() => document.fonts.ready).then(refresh); setInterval(refresh, 20000);
